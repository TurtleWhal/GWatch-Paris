<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GWatch — Live Simulator</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0e0e10;
    color: #ddd;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* The wrapper is intentionally a few px larger than the iframe inside.
   * If they're the same size, the border-radius curve passes exactly
   * through the iframe's pixel edge, and the browser's anti-aliasing
   * along the curve has nothing valid to sample on the "outside" — it
   * fades to a transparent edge that reads as a gray sliver. Giving the
   * wrapper a 4px buffer of solid #000 around the iframe means the AA
   * samples wrapper-bg vs page-bg (both dark) instead — clean edge. */
  .sim-frame {
    width: 244px;
    height: 244px;
    border-radius: 50%;
    overflow: hidden;
    background: #000;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .5), inset 0 0 0 6px #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    isolation: isolate;
  }
  .sim-frame iframe {
    width: 240px;
    height: 240px;
    border: 0;
    display: block;
    background: transparent;
  }
</style>
</head>
<body>
  <div class="sim-frame">
    <iframe src="gwatch_sim.html" title="GWatch simulator"></iframe>
  </div>
</body>
</html>
